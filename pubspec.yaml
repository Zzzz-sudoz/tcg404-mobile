name: tcg404_mobile
description: "TCG404 collector storefront."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/collector-backdrop.png
    - assets/cards/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/barlow-0.ttf
          weight: 600
        - asset: assets/fonts/barlow-1.ttf
          weight: 700
        - asset: assets/fonts/barlow-2.ttf
          weight: 800
